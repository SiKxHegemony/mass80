# Tool configuration only. This is not a package definition.

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["vendor", ".venv", "captures", "tools/send_get_time_once.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# CARDS holds long card-body string literals; wrapping them would risk altering the text.
"tools/create_kanban.py" = ["E501"]
