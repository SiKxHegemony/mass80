# Stage 3b (volume query reply) of docs/plans/2026-10-09-stage3b-volume-query.md.
# Differs from the built-in defaults in TWO values: volume.max_fraction = 0.3 (default 0.5)
# and replies.volume_query = true (default false). The reply frame is INFERRED from
# disassembly and has NEVER been sent to the device: run it only with Shane watching the
# slider. Music and keys stay log-only. Take the headphones off for the first run.

[volume]
max_fraction = 0.3

[replies]
volume_query = true
