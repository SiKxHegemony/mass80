# mass80d stage 9f: real cover art on a 480x240 canvas with a flat grey fill. INFERRED, never sent to the device in this shape with real art.
# This makes the daemon (a) FETCH images from https://i.scdn.co (an EXTERNAL network request,
# no redirects, 3 s limit) and (b) READ local files from ONE directory only:
# /home/shane/.zen/firefox-mpris. Images are cropped to fill a 240x240 box, placed in the
# middle of a 480x240 canvas with a flat grey (fill_grey) on the sides, resized with magick
# and cached in memory. Run with --no-actions, headset off:
#   python -m mass80d --config configs/stage9f-cover-grey-fill.toml --no-actions
# Tune fill_grey (0-255) by editing this file. History: 32 was too dark (Shane); 49 is the
# brightness of Discord's 2022+ dark mode (a starting point, not measured from the screen).

[replies]
reply_get_music_info = true
get_cover = true

[cover]
local_dirs = ["/home/shane/.zen/firefox-mpris"]
# The built-in default size is now 480; this past stage keeps its 240x240 box on the canvas.
size = 240
canvas_width = 480
canvas_height = 240
fill_grey = 49
